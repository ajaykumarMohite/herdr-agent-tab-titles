name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Unit tests
        run: python3 -m unittest discover -s tests -p "*_test.py" -v
      - name: Byte-compile every script
        run: python3 -m compileall -q rename_tabs_from_agent_titles.py install_claude_code_hook.py
      - name: Check the shell smoke test parses
        run: sh -n tests/smoke.sh
